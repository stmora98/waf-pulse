name: Release

# Builds dashboard.zip and collector.zip with their dependencies vendored (no build step on Azure)
# and publishes them as release assets. The Deploy to Azure template downloads them from
# https://github.com/<owner>/<repo>/releases/latest/download/<file>.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r src/collector/requirements.txt -r src/dashboard/requirements.txt
          python -m pytest tests -q

      - name: Build packages
        run: |
          set -euo pipefail

          # Dashboard: runs from the package, so its dependencies are vendored inside the zip.
          mkdir -p build/dashboard
          cp -r src/dashboard/. build/dashboard/
          pip install --no-cache-dir \
            --target build/dashboard/.python_packages/lib/site-packages \
            --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 \
            --only-binary=:all: -r src/dashboard/requirements.txt
          find build/dashboard -name '__pycache__' -type d -prune -exec rm -rf {} +
          (cd build/dashboard && zip -qr ../../dashboard.zip .)

          # Collector: Python on Flex Consumption is deployed with a remote build, so the zip holds
          # only the project source. The platform installs requirements.txt.
          mkdir -p build/collector
          cp -r src/collector/. build/collector/
          find build/collector -name '__pycache__' -type d -prune -exec rm -rf {} +
          (cd build/collector && zip -qr ../../collector.zip .)

          ls -l dashboard.zip collector.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dashboard.zip collector.zip --clobber
          else
            gh release create "$TAG" dashboard.zip collector.zip --title "$TAG" --generate-notes --latest
          fi
